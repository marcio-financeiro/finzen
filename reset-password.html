<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#F4F1EC':'#0a0c10';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recuperar senha - FinZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="./css/variables.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/mobile.css">
<link rel="stylesheet" href="./css/editorial.css">
<script src="./js/version.js"></script>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c08a3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinZen">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  /* Mesmo conceito "Ledger" do login.html */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus{
    -webkit-box-shadow:0 0 0 100px var(--surface-2) inset !important;
    -webkit-text-fill-color:var(--input-color) !important;
    caret-color:var(--input-color) !important;
    border-color:var(--border) !important;
    transition:background-color 5000s ease-in-out 0s;
  }
  .auth-card input{
    background:var(--surface-2) !important;
    color:var(--input-color) !important;
    -webkit-text-fill-color:var(--input-color) !important;
  }

  .auth-page{
    position:relative;
    background:var(--app-bg);
    overflow:hidden;
  }
  .auth-page::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(to right, var(--border) 1px, transparent 1px),
      linear-gradient(to bottom, var(--border) 1px, transparent 1px);
    background-size:40px 40px;
    background-position:center;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at center, #000 40%, transparent 90%);
    mask-image:radial-gradient(ellipse 70% 60% at center, #000 40%, transparent 90%);
    pointer-events:none;
  }

  .auth-card{
    position:relative;
    z-index:1;
    box-shadow:none;
    border-radius:var(--radius-md);
    animation:auth-card-in .4s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes auth-card-in{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .brand{ align-items:baseline; gap:var(--space-2); margin-bottom:var(--space-6); }
  .brand-mark{
    all:unset;
    display:inline-block;
    font-family:var(--font-mono);
    font-size:var(--text-sm);
    font-weight:500;
    letter-spacing:.06em;
    color:var(--muted);
    border:1px solid var(--border);
    border-radius:4px;
    padding:2px 6px;
  }
  .brand h1{ font-size:var(--text-2xl); letter-spacing:-0.02em; }
  .brand-rule{ width:100%; height:1px; background:var(--border); margin:var(--space-4) 0 var(--space-5); }
  .brand-tagline{
    margin:0 0 var(--space-6);
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:var(--text-xs);
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  .auth-card input{ border-radius:6px; }
  .auth-card .btn-primary{ border-radius:6px; box-shadow:none; }
  .auth-card .btn-primary:hover{ transform:none; opacity:.92; }

  .password-field{ position:relative; }
  .password-field input{ padding-right:44px; }
  .password-toggle{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);
    width:32px;
    height:32px;
    display:grid;
    place-items:center;
    background:transparent;
    border:0;
    border-radius:4px;
    color:var(--muted);
    cursor:pointer;
    touch-action:manipulation;
  }
  .password-toggle:hover{ color:var(--text); background:var(--hover-overlay); }
  .password-toggle svg{ width:17px; height:17px; }

  .auth-footer{
    margin-top:var(--space-5);
    padding-top:var(--space-4);
    border-top:1px solid var(--border);
    text-align:left;
    font-size:var(--text-base);
    color:var(--muted);
  }
  .auth-footer a{
    color:var(--text);
    font-weight:600;
    text-decoration:underline;
    text-decoration-color:var(--border);
    text-underline-offset:3px;
  }
  .auth-footer a:hover{ text-decoration-color:currentColor; }

  @media (prefers-reduced-motion: reduce){
    .auth-card{ animation:none; }
  }
</style>
</head>

<body>
<main class="auth-page">
  <section class="auth-card">
    <div class="brand">
      <span class="brand-mark">FZ</span>
      <h1>FinZen</h1>
    </div>
    <div class="brand-rule"></div>

    <!-- Etapa 1: pedir e-mail -->
    <div id="stepRequest">
      <p class="brand-tagline">Recuperar senha</p>
      <form id="requestForm" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn-primary full" id="btnEnviar">Enviar link de recuperação</button>
      </form>
      <div id="mensagemRequest" class="message" role="status" aria-live="polite"></div>
      <div class="auth-footer">
        <a href="./login.html">Voltar para o login</a>
      </div>
    </div>

    <!-- Etapa 2: definir nova senha (só aparece com link do e-mail) -->
    <div id="stepNewPassword" style="display:none">
      <p class="brand-tagline">Definir nova senha</p>
      <form id="newPasswordForm" novalidate>
        <div class="form-group">
          <label for="novaSenha">Nova senha</label>
          <div class="password-field">
            <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
            <button type="button" class="password-toggle" id="btnTogglePassword" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path id="eyeIconPath" d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle id="eyeIconPupil" cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmarSenha">Confirmar nova senha</label>
          <input type="password" id="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary full" id="btnSalvarSenha">Salvar nova senha</button>
      </form>
      <div id="mensagemNewPassword" class="message" role="status" aria-live="polite"></div>
    </div>

  </section>
</main>

<script type="module" src="./js/resetPassword.js"></script>
</body>
</html>
