<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#F4F1EC':'#0a0c10';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Entrar - FinZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="./css/variables.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/mobile.css">
<link rel="stylesheet" href="./css/editorial.css">
<script src="./js/version.js"></script>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c08a3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinZen">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  /* ── Fix autofill do Chrome/Safari que deixa fundo branco ──
     Antes forçava texto branco fixo (#fff !important) mesmo no tema claro,
     deixando o texto digitado praticamente invisível (branco sobre creme).
     Usa var(--input-color), que já é themed (branco no dark, escuro no light). */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus{
    -webkit-box-shadow:0 0 0 100px var(--surface-2) inset !important;
    -webkit-text-fill-color:var(--input-color) !important;
    caret-color:var(--input-color) !important;
    border-color:var(--border) !important;
    transition:background-color 5000s ease-in-out 0s;
  }
  .auth-card input{
    background:var(--surface-2) !important;
    color:var(--input-color) !important;
    -webkit-text-fill-color:var(--input-color) !important;
  }

  /* ── Atmosfera: glow dourado respirando devagar atrás do card ── */
  .auth-page{ position:relative; overflow:hidden; }
  .auth-page::before{
    content:'';
    position:absolute;
    inset:-20%;
    background:
      radial-gradient(circle at 30% 20%, rgba(220,176,103,.10), transparent 40%),
      radial-gradient(circle at 75% 80%, rgba(192,138,62,.08), transparent 42%);
    animation:auth-glow 14s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes auth-glow{
    0%,100%{ opacity:.7; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.06); }
  }

  /* ── Card: entra com fade + leve subida ── */
  .auth-card{
    position:relative;
    animation:auth-card-in .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes auth-card-in{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ── Marca ── */
  .brand-tagline{
    margin:0;
    color:var(--muted);
    font-size:var(--text-sm);
    letter-spacing:.02em;
  }

  /* ── Campo de senha com botão de visibilidade ── */
  .password-field{ position:relative; }
  .password-field input{ padding-right:44px; }
  .password-toggle{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    background:transparent;
    border:0;
    border-radius:8px;
    color:var(--muted);
    cursor:pointer;
    touch-action:manipulation;
  }
  .password-toggle:hover{ color:var(--text); background:var(--hover-overlay); }
  .password-toggle svg{ width:18px; height:18px; }

  /* ── Rodapé do card: link de cadastro, sutil (a ação primária é entrar) ── */
  .auth-footer{
    margin-top:var(--space-5);
    padding-top:var(--space-4);
    border-top:1px solid var(--border);
    text-align:center;
    font-size:var(--text-base);
    color:var(--muted);
  }
  .auth-footer button{
    background:none;
    border:0;
    padding:0;
    margin:0;
    color:var(--accent);
    font-weight:700;
    font-size:inherit;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .auth-footer button:hover{ color:var(--accent-bright); }

  @media (prefers-reduced-motion: reduce){
    .auth-page::before{ animation:none; }
    .auth-card{ animation:none; }
  }
</style>
</head>

<body>
<main class="auth-page">
  <section class="auth-card">
    <div class="brand">
      <span class="brand-mark">FZ</span>
      <div>
        <h1>FinZen</h1>
        <p class="brand-tagline">Assessor financeiro pessoal</p>
      </div>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="password-field">
          <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="btnTogglePassword" aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path id="eyeIconPath" d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"/>
              <circle id="eyeIconPupil" cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary full" id="btnLogin">Entrar</button>
    </form>

    <div id="mensagem" class="message" role="status" aria-live="polite"></div>

    <div class="auth-footer">
      Ainda não tem conta? <button type="button" id="btnCadastro">Criar conta</button>
    </div>
  </section>
</main>

<script type="module" src="./js/auth.js"></script>
</body>
</html>
