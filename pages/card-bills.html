<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#f3f7f4':'#0a0f0d';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Faturas - FinZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<link rel="stylesheet" href="../css/pages/card-bills.css">
<script src="../js/version.js"></script>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0f0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinZen">
<link rel="apple-touch-icon" href="../icons/icon-192.png">

</head>

<body class="bills-page">
<div class="app-shell">
  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>


  <main class="content">
    <header class="topbar">
      <div>
        <h1>Faturas</h1>
        <p id="userEmail" class="muted">Veja o que vence, pague no momento certo e mantenha o controle.</p>
      </div>
      <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
    </header>

    <!-- Filtro de cartão -->
    <section class="panel">
      <div class="bills-filter">
        <label for="filtroCartao" style="margin:0;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap">Filtrar cartão</label>
        <select id="filtroCartao">
          <option value="">Todos os cartões</option>
        </select>
      </div>
      <div class="bills-filter" style="padding-top:0">
        <label for="filtroMesPesquisa" style="margin:0;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap">Pesquisar fatura de um mês</label>
        <input type="month" id="filtroMesPesquisa">
        <button type="button" class="btn btn-secondary compact" id="btnPesquisarMes">Pesquisar</button>
        <button type="button" class="btn compact" id="btnLimparPesquisa" style="display:none">Voltar</button>
      </div>
      <div id="mensagemFatura" class="message" style="padding:0 18px 14px"></div>
    </section>

    <!-- Faturas -->
    <div id="listaFaturas"></div>

  </main>
</div>

<!-- Modal editar lançamento de cartão -->
<div id="modalEditarItem" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:420px">
    <h3 style="margin:0 0 16px;font-size:1rem">Editar lançamento</h3>
    <div class="form-group">
      <label for="editDescricao">Descrição</label>
      <input type="text" id="editDescricao" class="form-control">
    </div>
    <div class="form-group">
      <label for="editValor">Valor da parcela (R$)</label>
      <input type="text" id="editValor" inputmode="decimal" class="form-control">
    </div>
    <div class="form-group">
      <label for="editCategoria">Categoria</label>
      <select id="editCategoria" class="form-control">
        <option value="">Sem categoria</option>
      </select>
    </div>
    <div class="form-group">
      <label for="editDataCompra">Data da compra</label>
      <input type="date" id="editDataCompra" class="form-control">
    </div>
    <div class="form-group">
      <label for="editFaturaRef">Fatura (mês de referência)</label>
      <input type="month" id="editFaturaRef" class="form-control">
    </div>
    <div id="editAtualizarParcelas" style="display:none;margin-top:4px">
      <label style="font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="editAtualizarTodasParcelas" checked>
        Atualizar também as parcelas futuras
      </label>
    </div>
    <div id="editMensagem" class="message" style="margin-top:8px"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button type="button" class="btn btn-primary" onclick="salvarEdicaoItem()">Salvar</button>
      <button type="button" class="btn" onclick="fecharModalItem()">Cancelar</button>
    </div>
  </div>
</div>

<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/cardBills.js"></script>
</body>
</html>
