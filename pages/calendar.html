<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#f3f7f4':'#0a0f0d';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calendário - FinZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<link rel="stylesheet" href="../css/pages/calendar.css">
<script src="../js/version.js"></script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0f0d">
</head>
<body>
<div class="app-layout">
  <div id="navContainer"></div>
  <main class="content">

    <section class="panel" style="margin:20px;padding:0;overflow:hidden;">

      <!-- Header -->
      <div style="padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div>
          <h1 style="margin:0;font-size:22px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>Calendário</h1>
          <p id="userEmail" class="muted" style="margin:2px 0 0;font-size:12px;"></p>
        </div>
        <button type="button" class="btn btn-secondary compact" id="btnVoltar">← Dashboard</button>
      </div>

      <!-- Toolbar -->
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button id="btnAnterior">‹</button>
          <span class="cal-mes-label" id="calLabel">—</span>
          <button id="btnProximo">›</button>
          <button id="btnHoje" style="font-size:11px;">Hoje</button>
        </div>
        <div class="cal-views">
          <button class="cal-view-btn active" data-view="mensal">Mensal</button>
          <button class="cal-view-btn" data-view="semanal">Semanal</button>
          <button class="cal-view-btn" data-view="lista">Lista</button>
        </div>
        <button class="btn-novo-evento" id="btnNovoEvento">+ Novo evento</button>
        <button class="btn btn-secondary compact" id="btnExportarMes" title="Exportar mês para iPhone"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>Exportar mês</button>
      </div>

      <!-- Corpo do calendário -->
      <div id="calBody" style="min-height:400px;"></div>

    </section>

  </main>
</div>

<!-- Modal de evento -->
<div id="calModalEvento" style="display:none;">
  <div class="cal-modal-backdrop" id="calModalBackdrop"></div>
  <div class="cal-modal">
    <h2 id="calModalTitulo">Novo Evento</h2>

    <div class="form-group">
      <label for="evTitulo">Título *</label>
      <input type="text" id="evTitulo" placeholder="Ex: Consulta médica, Embarque...">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group">
        <label for="evTipo">Tipo *</label>
        <select id="evTipo">
          <option value="compromisso">🎯 Compromisso</option>
          <option value="tarefa">📋 Tarefa</option>
          <option value="financeiro">💰 Financeiro</option>
          <option value="saude">🏥 Saúde</option>
          <option value="offshore">⚓ Offshore</option>
          <option value="manutencao">🔧 Manutenção</option>
          <option value="documento">📄 Documento</option>
        </select>
      </div>
      <div class="form-group">
        <label for="evStatus">Status</label>
        <select id="evStatus">
          <option value="pendente">Pendente</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
      <div class="form-group">
        <label for="evDataInicio">Data início *</label>
        <input type="date" id="evDataInicio">
      </div>
      <div class="form-group">
        <label for="evDataFim">Data fim</label>
        <input type="date" id="evDataFim">
      </div>
      <div class="form-group">
        <label for="evHora">Hora</label>
        <input type="time" id="evHora">
      </div>
    </div>

    <div class="form-group">
      <label for="evLocal">Local</label>
      <input type="text" id="evLocal" placeholder="Ex: Hospital, Plataforma P-51...">
    </div>

    <div class="form-group">
      <label for="evDescricao">Descrição / Observações</label>
      <textarea id="evDescricao" rows="3" placeholder="Detalhes do evento..."></textarea>
    </div>

    <!-- Lembrete por e-mail -->
    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <input type="checkbox" id="evNotifEmail" style="width:16px;height:16px;">
        <label for="evNotifEmail" style="margin:0;font-size:13px;font-weight:700;cursor:pointer;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Lembrete por e-mail
        </label>
      </div>
      <div id="evNotifOpcoes" style="display:none;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="form-group" style="margin:0;">
            <label for="evLembreteDias">Avisar quantos dias antes</label>
            <select id="evLembreteDias">
              <option value="0">No dia</option>
              <option value="1" selected>1 dia antes</option>
              <option value="3">3 dias antes</option>
              <option value="7">7 dias antes</option>
              <option value="15">15 dias antes</option>
              <option value="30">30 dias antes</option>
            </select>
          </div>
          <div class="form-group" style="margin:0;">
            <label for="evEmail">E-mail destino</label>
            <input type="email" id="evEmail" placeholder="seu@email.com">
          </div>
        </div>
      </div>
    </div>

    <!-- Exportar para iPhone -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
      <input type="checkbox" id="evIcsExport" style="width:16px;height:16px;">
      <label for="evIcsExport" style="margin:0;font-size:13px;font-weight:700;cursor:pointer;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>Exportar para iPhone (iCal)
      </label>
    </div>

    <div id="evMsg" class="message" style="min-height:0;"></div>

    <div class="cal-modal-actions">
      <button type="button" class="btn btn-primary" id="btnSalvarEvento"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>Salvar</button>
      <button type="button" class="btn btn-secondary" id="btnCancelarEvento">Cancelar</button>
      <button type="button" class="btn btn-danger" id="btnExcluirEvento" style="display:none;margin-left:auto;">Excluir</button>
    </div>
  </div>
</div>

<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/calendar.js"></script>
</body>
</html>
