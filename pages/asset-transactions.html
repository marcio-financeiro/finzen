<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#efe7e3':'#2a1d20';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Movimentações de Investimentos - FinZen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<script src="../js/version.js"></script>
</head>

<body>

<div class="app-shell">

  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>

  <main class="content">

    <header class="topbar">
      <div>
        <h1>Movimentações de Investimentos</h1>
        <p id="userEmail" class="muted"></p>
      </div>

      <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
    </header>

    <section class="panel">
      <div class="panel-header">
        <h2>Nova Movimentação</h2>
      </div>

      <div class="form-grid">

        <div class="form-group">
          <label for="ativoMovimento">Ativo</label>
          <select id="ativoMovimento">
            <option value="">Carregando ativos...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tipoMovimento">Tipo</label>
          <select id="tipoMovimento">
            <option value="">Selecione</option>
            <option value="compra">Compra</option>
            <option value="venda">Venda</option>
            <option value="dividendo">Dividendo</option>
            <option value="jcp">JCP</option>
            <option value="rendimento_fii">Rendimento FII</option>
            <option value="aporte">Aporte</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantidadeMovimento">Quantidade</label>
          <input type="number" id="quantidadeMovimento" placeholder="0" step="0.000001" inputmode="decimal">
        </div>

        <div class="form-group">
          <label for="precoMovimento">Preço unitário</label>
          <input type="number" id="precoMovimento" placeholder="0,00" step="0.000001" inputmode="decimal">
        </div>

        <div class="form-group">
          <label for="valorTotalMovimento">Valor total</label>
          <input type="text" id="valorTotalMovimento" placeholder="0,00" inputmode="decimal">
        </div>

        <div class="form-group">
          <label for="dataMovimento">Data</label>
          <input type="date" id="dataMovimento">
        </div>

        <div class="form-group">
          <label for="observacaoMovimento">Observação</label>
          <input type="text" id="observacaoMovimento" placeholder="Opcional">
        </div>

      </div>

      <button type="button" class="btn btn-primary" id="btnSalvarMovimento">Salvar Movimentação</button>

      <div id="mensagemMovimento" class="message"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Histórico</h2>
      </div>

      <div id="listaMovimentos" class="table-wrap"></div>
    </section>

  </main>

</div>


<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/assetTransactions.js"></script>

</body>
</html>
