<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#f3f7f4':'#0a0f0d';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Parcelamentos - FinZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<link rel="stylesheet" href="../css/pages/installments.css">
<script src="../js/version.js"></script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0f0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinZen">
<link rel="apple-touch-icon" href="../icons/icon-192.png">

</head>

<body>
<div class="app-shell">
  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>

  <main class="content">
    <header class="topbar">
      <div>
        <h1>Parcelamentos</h1>
        <p id="userEmail" class="muted"></p>
      </div>
      <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
    </header>

    <div id="mensagemParcelamentos" class="message" style="margin-bottom:12px"></div>

    <div id="resumoCards"></div>

    <section class="panel" style="margin-bottom:16px">
      <div class="installments-filter">
        <label for="filtroCartao" style="color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;cursor:default">Filtrar cartão</label>
        <select id="filtroCartao">
          <option value="">Todos os cartões</option>
        </select>
        <label>
          <input type="checkbox" id="chkMostrarQuitadas">
          Mostrar quitadas
        </label>
      </div>
    </section>

    <section class="panel" style="margin-bottom:16px">
      <div class="panel-header"><h2>Projeção mensal (parcelas em aberto)</h2></div>
      <div id="tabelaProjecao" style="padding:0 20px 16px;overflow-x:auto"></div>
    </section>

    <section>
      <div id="listaCompras"></div>
    </section>

  </main>
</div>

<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/installments.js"></script>
</body>
</html>
