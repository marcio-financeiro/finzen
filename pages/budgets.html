<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#f3f7f4':'#0a0f0d';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orçamento - FinZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<script src="../js/version.js"></script>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0f0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="planning-page budgets-page">
<div class="app-shell">
  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>


  <main class="content">
    <header class="topbar">
      <div>
        <h1>Orçamento</h1>
        <p id="userEmail" class="muted">Defina limites que ajudam seu dinheiro a seguir o plano.</p>
      </div>
      <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
    </header>

    <!-- KPIs -->
    <section class="kpi-grid" style="margin-bottom:20px">
      <article class="kpi-card">
        <span>Total Planejado</span>
        <strong id="totalPlanejado">R$ 0,00</strong>
      </article>
      <article class="kpi-card">
        <span>Total Gasto</span>
        <strong id="totalGasto" class="negative">R$ 0,00</strong>
      </article>
      <article class="kpi-card">
        <span>Saldo Restante</span>
        <strong id="saldoRestante">R$ 0,00</strong>
      </article>
    </section>

    <!-- Filtro de mês -->
    <section class="panel" style="margin-bottom:16px">
      <div class="panel-header">
        <h2>Mês de referência</h2>
      </div>
      <div style="padding:16px 20px">
        <input type="month" id="mesReferencia" aria-label="Mês de referência do orçamento" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)">
      </div>
    </section>

    <!-- Novo orçamento -->
    <section class="panel" style="margin-bottom:16px">
      <div class="panel-header"><h2>Adicionar orçamento</h2></div>
      <div class="form-grid" style="padding:16px 20px">
        <div class="form-group">
          <label for="categoriaOrcamento">Categoria</label>
          <select id="categoriaOrcamento"><option value="">Carregando...</option></select>
        </div>
        <div class="form-group">
          <label for="valorPlanejado">Valor planejado (R$)</label>
          <input type="text" id="valorPlanejado" placeholder="0,00" inputmode="decimal">
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end">
          <button id="btnSalvarOrcamento" class="btn btn-primary" style="width:100%">+ Adicionar</button>
        </div>
      </div>
      <div id="mensagemOrcamento" class="message" style="margin:0 20px 16px"></div>
    </section>

    <!-- Lista de orçamentos -->
    <section class="panel">
      <div class="panel-header"><h2>Orçamentos do mês</h2></div>
      <div id="listaOrcamentos" style="padding:0 20px 8px">
        <p class="muted" style="padding:16px 0">Carregando...</p>
      </div>
    </section>

  </main>
</div>

<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/budgets.js"></script>
</body>
</html>
