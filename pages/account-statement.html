<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#F4F1EC':'#0a0c10';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Extrato de Contas - FinZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<link rel="stylesheet" href="../css/pages/account-statement.css">
<script src="../js/version.js"></script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#c08a3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinZen">
<link rel="apple-touch-icon" href="../icons/icon-192.png">

</head>

<body>
<div class="app-shell">

  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>

  <main class="content">

    <header class="topbar">
      <div>
        <h1>Extrato de Contas</h1>
        <p id="userEmail" class="muted"></p>
      </div>
      <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
    </header>

    <div class="stmt-filters">
      <div>
        <label>Conta</label>
        <select id="filtroConta"><option value="">Todas as contas</option></select>
      </div>
      <div>
        <label>Mês</label>
        <input type="month" id="filtroMes">
      </div>
      <div>
        <label>Tipo</label>
        <select id="filtroTipo">
          <option value="">Todos</option>
          <option value="receita">Receita</option>
          <option value="despesa">Despesa</option>
        </select>
      </div>
      <div>
        <label>Status</label>
        <select id="filtroStatus">
          <option value="">Todos</option>
          <option value="pago">Pago</option>
          <option value="pendente">Pendente</option>
        </select>
      </div>
      <button class="btn btn-primary compact" id="btnFiltrar">Filtrar</button>
    </div>

    <div class="stmt-kpis">
      <div class="stmt-kpi">
        <span>Saldo da conta</span>
        <strong id="kpiSaldo" class="positive">R$ 0,00</strong>
      </div>
      <div class="stmt-kpi">
        <span>Entradas no período</span>
        <strong id="kpiEntradas" class="positive">R$ 0,00</strong>
      </div>
      <div class="stmt-kpi">
        <span>Saídas no período</span>
        <strong id="kpiSaidas" class="negative">R$ 0,00</strong>
      </div>
      <div class="stmt-kpi">
        <span>Resultado</span>
        <strong id="kpiResultado">R$ 0,00</strong>
      </div>
      <div class="stmt-kpi">
        <span>Lançamentos</span>
        <strong id="kpiQtd">0</strong>
      </div>
    </div>

    <section class="panel">
      <div class="panel-header">
        <h2>Lançamentos</h2>
        <span id="stmtPeriodo" class="muted" style="font-size:13px;"></span>
      </div>
      <div id="stmtLista" class="table-wrap">
        <p class="muted" style="padding:24px">Selecione uma conta e período para ver o extrato.</p>
      </div>
    </section>

  </main>
</div>


<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/account-statement.js"></script>
</body>
</html>
