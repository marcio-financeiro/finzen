<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#F4F1EC':'#0a0c10';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FinZen</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinZen">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/pages/mobile.css">
<script src="../js/version.js"></script>
</head>
<body>
<div class="mobile-shell">

  <!-- Header -->
  <div class="mob-header">
    <div class="mob-header-left">
      <span class="mob-logo">VYN</span>
      <span class="mob-greeting" id="mobGreeting">Bom dia!</span>
    </div>
    <div class="mob-avatar" id="mobAvatar" data-action="irParaDashboard">FZ</div>
  </div>

  <!-- Conteúdo scrollável -->
  <div class="mob-scroll" id="mobScroll">
    <div class="mob-loading" id="mobLoading">
      <div class="mob-spinner"></div>
      Carregando seus dados...
    </div>

    <!-- Saldo principal -->
    <div class="mob-saldo-card" id="mobSaldoCard" style="display:none">
      <div class="mob-saldo-label">Saldo em contas</div>
      <div class="mob-saldo-valor" id="mobSaldo">R$ 0,00</div>
      <div class="mob-saldo-sub" id="mobSaldoSub">Carregando...</div>
    </div>

    <!-- KPIs -->
    <div class="mob-kpis" id="mobKpis" style="display:none">
      <div class="mob-kpi">
        <div class="mob-kpi-label">Receitas do mês</div>
        <div class="mob-kpi-valor" id="mobReceitas" style="color:var(--green)">—</div>
      </div>
      <div class="mob-kpi">
        <div class="mob-kpi-label">Despesas do mês</div>
        <div class="mob-kpi-valor" id="mobDespesas" style="color:var(--red)">—</div>
      </div>
      <div class="mob-kpi">
        <div class="mob-kpi-label">Resultado do mês</div>
        <div class="mob-kpi-valor" id="mobResultado">—</div>
      </div>
      <div class="mob-kpi">
        <div class="mob-kpi-label">Faturas abertas</div>
        <div class="mob-kpi-valor" id="mobFaturas" style="color:var(--yellow)">—</div>
      </div>
    </div>

    <!-- Alertas -->
    <div class="mob-alertas" id="mobAlertas" style="display:none">
      <div class="mob-section-title">⚠️ Alertas</div>
      <div id="mobAlertasList"></div>
    </div>

    <!-- Contas -->
    <div class="mob-orcamentos" id="mobOrcamentos" style="display:none">
      <div class="mob-section-title">🏦 Saldo das contas</div>
      <div id="mobContasList"></div>
    </div>

    <!-- Últimos lançamentos -->
    <div class="mob-lancamentos" id="mobLancamentos" style="display:none">
      <div class="mob-section-title">💸 Últimos lançamentos</div>
      <div id="mobLancamentosList"></div>
    </div>

    <!-- Botão modo avançado -->
    <button class="mob-advanced-btn" data-action="ativarModoAvancado">
      🖥️ Abrir modo avançado (desktop)
    </button>

  </div>

  <!-- Bottom Nav -->
  <nav class="mob-bottom-nav">
    <a class="mob-nav-item ativo" data-action="scrollTop">
      <span class="mob-nav-item-icon">🏠</span>
      <span>Início</span>
    </a>
    <a class="mob-nav-item" href="./analytics.html">
      <span class="mob-nav-item-icon">📊</span>
      <span>Analytics</span>
    </a>
    <button class="mob-fab" id="mobFab" data-action="abrirModal">＋</button>
    <a class="mob-nav-item" href="./budgets.html">
      <span class="mob-nav-item-icon">🎯</span>
      <span>Orçamento</span>
    </a>
    <a class="mob-nav-item" href="./notifications.html">
      <span class="mob-nav-item-icon">🔔</span>
      <span>Alertas</span>
    </a>
  </nav>

</div>

<!-- Modal de lançamento rápido -->
<div class="mob-modal-overlay" id="mobModalOverlay" data-action="fecharModalFora">
  <div class="mob-modal" id="mobModal">
    <div class="mob-modal-handle"></div>
    <div class="mob-modal-title">⚡ Lançamento rápido</div>

    <!-- Tipo -->
    <div class="mob-tipo-tabs">
      <button class="mob-tipo-btn despesa ativo" id="btnTipoDespesa" data-action="selecionarTipo" data-tipo="despesa">
        ↓ Despesa
      </button>
      <button class="mob-tipo-btn receita" id="btnTipoReceita" data-action="selecionarTipo" data-tipo="receita">
        ↑ Receita
      </button>
      <button class="mob-tipo-btn" id="btnTipoCartao" data-action="selecionarTipo" data-tipo="cartao"
        style="background:rgba(79,132,243,.15);color:var(--accent)">
        💳 Cartão
      </button>
    </div>

    <!-- Valor -->
    <div class="mob-field">
      <label>Valor (R$)</label>
      <input type="text" id="mobValor" class="mob-valor-input"
        placeholder="0,00" inputmode="decimal">
    </div>

    <!-- Descrição -->
    <div class="mob-field">
      <label>Descrição</label>
      <input type="text" id="mobDescricao" placeholder="Ex: Mercado, Uber, Almoço...">
    </div>

    <!-- Categorias rápidas -->
    <div class="mob-field">
      <label>Categoria</label>
      <div class="mob-cats-grid" id="mobCatsGrid"></div>
      <select id="mobCatSelect" style="margin-top:8px">
        <option value="">Selecionar outra...</option>
      </select>
    </div>

    <!-- Conta -->
    <div class="mob-field" id="mobContaField">
      <label>Conta</label>
      <select id="mobConta"></select>
    </div>

    <!-- Cartão (apenas para tipo cartão) -->
    <div class="mob-field" id="mobCartaoField" style="display:none">
      <label>Cartão de crédito</label>
      <select id="mobCartao"></select>
    </div>

    <!-- Parcelas (apenas para tipo cartão) -->
    <div class="mob-field" id="mobParcelasField" style="display:none">
      <label>Parcelas</label>
      <select id="mobParcelas">
        <option value="1">1x (à vista)</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
        <option value="6">6x</option>
        <option value="10">10x</option>
        <option value="12">12x</option>
      </select>
    </div>

    <!-- Data -->
    <div class="mob-field">
      <label>Data</label>
      <input type="date" id="mobData">
    </div>

    <button class="mob-btn-salvar" id="mobBtnSalvar" data-action="salvarLancamento">
      ✓ Salvar lançamento
    </button>
  </div>
</div>

<script type="module" src="../js/mobile.js"></script>
</body>
</html>
