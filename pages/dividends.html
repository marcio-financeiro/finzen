<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#F4F1EC':'#0a0c10';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dividendos - FinZen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<link rel="stylesheet" href="../css/modern-wealth.css">
<script src="../js/version.js"></script>
</head>

<body>

<div class="app-shell">

  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>

  <main class="content">

    <header class="topbar">
      <div>
        <h1>Dividendos e Rendimentos</h1>
        <p id="userEmail" class="muted"></p>
      </div>

      <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
    </header>

    <section class="kpi-grid">
      <article class="kpi-card">
        <span>Total recebido no mês</span>
        <strong id="totalMes" class="positive">R$ 0,00</strong>
      </article>

      <article class="kpi-card">
        <span>Total recebido no ano</span>
        <strong id="totalAno" class="positive">R$ 0,00</strong>
      </article>

      <article class="kpi-card">
        <span>Dividendos no mês</span>
        <strong id="dividendosMes">R$ 0,00</strong>
      </article>

      <article class="kpi-card">
        <span>JCP no mês</span>
        <strong id="jcpMes">R$ 0,00</strong>
      </article>

      <article class="kpi-card">
        <span>Rendimentos FII no mês</span>
        <strong id="fiiMes">R$ 0,00</strong>
      </article>

      <article class="kpi-card">
        <span>Imposto retido no ano</span>
        <strong id="impostoAno" class="negative">R$ 0,00</strong>
      </article>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Filtros</h2>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="anoFiltro">Ano</label>
          <input type="number" id="anoFiltro" min="2000" max="2100" inputmode="numeric">
        </div>

        <div class="form-group">
          <label for="tipoFiltro">Tipo</label>
          <select id="tipoFiltro">
            <option value="">Todos</option>
            <option value="dividendo">Dividendos</option>
            <option value="jcp">JCP</option>
            <option value="rendimento_fii">Rendimentos FII</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ativoFiltro">Ativo</label>
          <select id="ativoFiltro">
            <option value="">Todos os ativos</option>
          </select>
        </div>
      </div>

      <button type="button" class="btn btn-primary" id="btnFiltrar">Aplicar Filtros</button>

      <div id="mensagemDividendos" class="message"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Distribuição por Ativo</h2>
      </div>
      <div id="pizzaProventos"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Histórico de Proventos</h2>
      </div>

      <div id="listaDividendos" class="table-wrap"></div>
    </section>

  </main>

</div>


<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/dividends.js"></script>

</body>
</html>
