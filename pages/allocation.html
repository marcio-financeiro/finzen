<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#F4F1EC':'#0a0c10';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alocação - FinZen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<link rel="stylesheet" href="../css/modern-wealth.css">
<script src="../js/version.js"></script>
</head>

<body>

<div class="app-shell">

  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>

  <main class="content">

    <header class="topbar">
      <div>
        <h1>Alocação da Carteira</h1>
        <p id="userEmail" class="muted"></p>
      </div>

      <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
    </header>

    <section class="kpi-grid">
      <article class="kpi-card">
        <span>Patrimônio analisado</span>
        <strong id="patrimonioTotal">R$ 0,00</strong>
      </article>

      <article class="kpi-card">
        <span>Total alocado no alvo</span>
        <strong id="totalAlvo">0%</strong>
      </article>

      <article class="kpi-card">
        <span>Classe mais defasada</span>
        <strong id="classeDefasada">-</strong>
      </article>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Definir Alocação Alvo</h2>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="classeAlvo">Classe</label>
          <select id="classeAlvo">
            <option value="">Selecione</option>
            <option value="acao">Ações BR</option>
            <option value="fii">FIIs</option>
            <option value="etf">ETFs BR</option>
            <option value="acao_eua">Ações EUA</option>
            <option value="etf_eua">ETFs EUA</option>
            <option value="renda_fixa">Renda Fixa</option>
            <option value="cripto">Cripto</option>
          </select>
        </div>

        <div class="form-group">
          <label for="percentualAlvo">Percentual alvo</label>
          <input type="number" id="percentualAlvo" placeholder="0" step="0.01" inputmode="decimal">
        </div>
      </div>

      <button type="button" class="btn btn-primary" id="btnSalvarAlvo">Salvar Alvo</button>
      <button type="button" class="btn btn-secondary" id="btnCriarPadrao">Criar Alocação Padrão</button>

      <div id="mensagemAlocacao" class="message"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Sugestão de Aporte</h2>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="valorAporte">Valor do aporte</label>
          <input type="text" id="valorAporte" placeholder="Ex: 1000" inputmode="decimal">
        </div>
      </div>

      <button type="button" class="btn btn-primary" id="btnCalcularAporte">Calcular Sugestão</button>

      <div id="sugestaoAporte" class="table-wrap"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Atual x Ideal</h2>
      </div>

      <div id="donutsAlocacao" style="margin-bottom:24px"></div>
      <div id="tabelaAlocacao" class="table-wrap"></div>
    </section>

  </main>

</div>


<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/allocation.js"></script>

</body>
</html>
