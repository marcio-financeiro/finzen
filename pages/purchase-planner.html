<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#efe7e3':'#2a1d20';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Planejador de Compras - FinZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<script src="../js/version.js"></script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2a1d20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="app-shell">
  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>

  <main class="content">
    <header class="topbar">
      <div>
        <h1>Planejador de Compras</h1>
        <p id="userEmail" class="muted"></p>
      </div>
      <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
    </header>

    <!-- Formulário de simulação -->
    <section class="panel" style="margin-bottom:16px">
      <div class="panel-header"><h2>Simular compra</h2></div>
      <div class="form-grid" style="padding:16px 20px">
        <div class="form-group">
          <label for="descricaoCompra">Descrição (opcional)</label>
          <input type="text" id="descricaoCompra" placeholder="Ex: Notebook">
        </div>
        <div class="form-group">
          <label for="valorCompra">Valor total (R$)</label>
          <input type="text" id="valorCompra" placeholder="0,00" inputmode="decimal">
        </div>
        <div class="form-group">
          <label for="dataCompra">Data da compra</label>
          <input type="date" id="dataCompra">
        </div>
        <div class="form-group">
          <label for="formaPagamento">Forma de pagamento</label>
          <select id="formaPagamento">
            <option value="conta">Débito da conta (à vista)</option>
            <option value="cartao_vista">Cartão à vista (1x)</option>
            <option value="cartao_parcelado">Cartão parcelado</option>
          </select>
        </div>
        <div class="form-group" id="grupoConta">
          <label for="contaCompra">Conta</label>
          <select id="contaCompra"><option value="">Carregando...</option></select>
        </div>
        <div class="form-group" id="grupoCartao" style="display:none">
          <label for="cartaoCompra">Cartão</label>
          <select id="cartaoCompra"><option value="">Carregando...</option></select>
        </div>
        <div class="form-group" id="grupoParcelas" style="display:none">
          <label for="parcelasCompra">Parcelas</label>
          <input type="number" id="parcelasCompra" min="2" max="60" value="2">
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end">
          <button id="btnSimular" class="btn btn-primary" style="width:100%">Simular</button>
        </div>
      </div>
      <div id="mensagemCompra" class="message" style="margin:0 20px 16px"></div>
    </section>

    <!-- Resultado -->
    <section class="panel" id="painelResultado" style="display:none">
      <div class="panel-header"><h2>Resultado da simulação</h2></div>
      <div id="veredito" style="padding:16px 20px"></div>
      <div id="tabelaResultado" style="padding:0 20px 16px;overflow-x:auto"></div>
    </section>

  </main>
</div>

<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/purchasePlanner.js"></script>
</body>
</html>
