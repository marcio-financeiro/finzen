<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#F4F1EC':'#0a0c10';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Analytics - FinZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<link rel="stylesheet" href="../css/pages/analytics.css">
<script src="../js/version.js"></script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#c08a3e">
</head>
<body>
<div class="app-shell">
  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>

  <main class="content">
    <header class="topbar">
      <div>
        <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><polyline points="3,17 9,11 13,15 21,6"/><polyline points="15,6 21,6 21,12"/></svg>Analytics</h1>
        <p id="userEmail" class="muted"></p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button onclick="location.reload()" class="btn btn-secondary compact"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M4 4v6h6"/><path d="M4.5 13a8 8 0 1 0 2.5-6.5L4 10"/></svg>Atualizar</button>
        <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
      </div>
    </header>

    <!-- KPIs -->
    <div class="an-kpi-grid">
      <div class="an-kpi">
        <span>Receitas (6 meses)</span>
        <strong id="kpiReceitas" class="positive">R$ 0,00</strong>
      </div>
      <div class="an-kpi">
        <span>Despesas (6 meses)</span>
        <strong id="kpiDespesas" class="negative">R$ 0,00</strong>
      </div>
      <div class="an-kpi">
        <span>Saldo em contas</span>
        <strong id="kpiSaldo" class="positive">R$ 0,00</strong>
      </div>
      <div class="an-kpi">
        <span>Total investido</span>
        <strong id="kpiInvest" style="color:#f59e0b">R$ 0,00</strong>
      </div>
      <div class="an-kpi">
        <span>Poupança média</span>
        <strong id="kpiPoupanca" style="color:#8b5cf6">0%</strong>
      </div>
      <div class="an-kpi">
        <span>Maior gasto (mês)</span>
        <strong id="kpiMaiorGasto" style="font-size:13px">—</strong>
      </div>
    </div>

    <!-- Gráficos linha 1 -->
    <div class="an-grid">
      <div class="an-card an-full">
        <div class="an-chart-wrap" style="height:280px">
          <canvas id="chartRecDes"></canvas>
        </div>
      </div>

      <div class="an-card">
        <div class="an-chart-wrap">
          <canvas id="chartSaldo"></canvas>
        </div>
      </div>

      <div class="an-card">
        <div class="an-chart-wrap">
          <canvas id="chartPoupanca"></canvas>
        </div>
      </div>
    </div>

    <!-- Carteira por classe -->
    <div class="an-grid">
      <div class="an-card an-full">
        <div class="an-chart-wrap" style="height:300px">
          <canvas id="chartInvestimentos"></canvas>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Loading -->
<div id="loadingOverlay">
  <div class="an-spinner"></div>
  <span>Carregando seus dados...</span>
</div>

<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/analytics.js"></script>
</body>
</html>
