<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var t=localStorage.getItem('finzen_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.background=t==='light'?'#f3f7f4':'#0a0f0d';if(localStorage.getItem('finzen_sidebar_rail')==='collapsed')document.documentElement.classList.add('sidebar-rail');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lançamentos e movimentações - FinZen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/editorial.css">
<link rel="stylesheet" href="../css/pages/movements.css">
<script src="../js/version.js"></script>


<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0f0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinZen">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
</head>

<body class="movement-page">
<div class="app-shell">
  <!-- Conteúdo interno é montado por navigation.js (ensureDesktopSidebar) —
       aside vazio só reserva o espaço, evita layout shift até o JS rodar -->
  <aside class="sidebar"></aside>


  <main class="content">
    <header class="topbar">
      <div>
        <p style="font-size:11px;color:var(--muted);margin:0 0 2px"><a href="./dashboard.html" style="color:var(--muted);text-decoration:none">Dashboard</a> › Movimentações</p>
        <h1>Lançamentos</h1>
        <p id="userEmail" class="muted">Registre agora. Acompanhe suas movimentações abaixo.</p>
      </div>
      <button type="button" class="btn btn-danger compact" id="btnLogout">Sair</button>
    </header>

    <!-- Formulário -->
    <section class="panel">
      <div class="panel-header">
        <h2 id="formTitle">Nova Movimentação</h2>
        <span id="formStepHint" class="muted" style="font-size:11px;font-weight:700">Selecione o tipo para ver os campos</span>
      </div>

      <div style="padding:20px">
        <div class="form-grid compact-form">

          <div class="form-group">
            <label for="movementType">Tipo</label>
            <select id="movementType">
              <option value="">Selecione</option>
              <option value="receita">Receita</option>
              <option value="despesa">Despesa</option>
              <option value="transferencia">Transferência</option>
              <option value="cambio">Câmbio (BRL ↔ USD)</option>
            </select>
          </div>

          <div class="form-group always-visible">
            <label for="movementDescription">Descrição</label>
            <input type="text" id="movementDescription" placeholder="Ex: Mercado, salário, pix" maxlength="80" autocomplete="off" list="movementDescList">
            <datalist id="movementDescList"></datalist>
          </div>

          <div class="form-group always-visible">
            <label for="movementAmount">Valor</label>
            <input type="text" id="movementAmount" placeholder="0,00" inputmode="decimal">
          </div>

          <div class="form-group always-visible">
            <label for="movementDate">Data</label>
            <input type="date" id="movementDate">
          </div>

          <div class="form-group conditional" id="paymentMethodGroup">
            <label for="paymentMethod">Forma de pagamento</label>
            <select id="paymentMethod">
              <option value="conta">Conta</option>
              <option value="cartao">Cartão de Crédito</option>
            </select>
          </div>

          <div class="form-group conditional" id="accountGroup">
            <label for="movementAccount">Conta</label>
            <select id="movementAccount"></select>
          </div>

          <div class="form-group conditional" id="fromAccountGroup">
            <label for="fromAccount">Conta origem</label>
            <select id="fromAccount"></select>
          </div>

          <div class="form-group conditional" id="toAccountGroup">
            <label for="toAccount">Conta destino</label>
            <select id="toAccount"></select>
          </div>

          <div class="form-group conditional" id="exchangeRateGroup">
            <label for="exchangeRate">Taxa de câmbio (USD/BRL)</label>
            <input type="number" id="exchangeRate" step="0.0001" placeholder="Ex: 5.15" inputmode="decimal">
          </div>

          <div class="form-group conditional" id="exchangePreviewGroup">
            <label for="exchangePreview">Valor convertido (estimativa)</label>
            <input type="text" id="exchangePreview" readonly
              style="background:var(--surface-2);color:var(--muted);" placeholder="Preencha valor e taxa">
          </div>

          <div class="form-group conditional" id="cardGroup">
            <label for="movementCard">Cartão</label>
            <select id="movementCard"></select>
          </div>

          <div class="form-group conditional" id="categoryGroup">
            <label for="movementCategory">Categoria</label>
            <select id="movementCategory"></select>
          </div>

          <div class="form-group conditional" id="installmentsGroup">
            <label for="movementInstallments">Parcelas</label>
            <input type="number" id="movementInstallments" min="1" max="60" value="1" inputmode="numeric">
          </div>

          <div class="form-group conditional" id="valueTypeGroup">
            <label for="movementValueType">Valor informado</label>
            <select id="movementValueType">
              <option value="total">Valor total da compra</option>
              <option value="parcela">Valor de cada parcela</option>
            </select>
            <small id="movementValuePreview" class="muted">Informe valor e parcelas.</small>
          </div>

          <div class="form-group conditional" id="invoiceGroup">
            <label for="movementInvoice">Fatura inicial</label>
            <select id="movementInvoice"></select>
          </div>

          <div class="form-group conditional" id="statusGroup">
            <label for="movementStatus">Status</label>
            <select id="movementStatus">
              <option value="pago">Pago</option>
              <option value="pendente">Pendente</option>
            </select>
          </div>

          <div class="form-group conditional" id="recurrenceGroup">
            <label for="movementRecurrence">Recorrência</label>
            <select id="movementRecurrence">
              <option value="nao">Não recorrente</option>
              <option value="mensal">Mensal</option>
              <option value="semanal">Semanal</option>
              <option value="anual">Anual</option>
            </select>
          </div>

          <div class="form-group conditional" id="recurrenceUntilGroup">
            <label for="movementRecurrenceUntil">Repetir até</label>
            <input type="date" id="movementRecurrenceUntil">
            <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-weight:400;font-size:12px;color:var(--muted);cursor:pointer">
              <input type="checkbox" id="movementRecurrenceNoEnd" style="width:auto">
              Sem data de término
            </label>
          </div>

          <div class="form-group full conditional" id="notesGroup">
            <label for="movementNotes">Observação</label>
            <input type="text" id="movementNotes" placeholder="Opcional" maxlength="120">
          </div>
        </div>

        <button type="button" class="btn btn-primary" id="btnSaveMovement">Salvar Movimentação</button>
        <button type="button" class="btn btn-secondary" id="btnCancelEdit" style="display:none">Cancelar edição</button>

        <div id="movementMessage" class="message"></div>
      </div>
    </section>

    <!-- Fluxo do mês (fixo no HTML, sem criação dinâmica) -->
    <section class="panel">
      <div class="panel-header">
        <h2>Fluxo do Mês</h2>
      </div>
      <div id="cashFlowMonthListFinZen" class="table-wrap">
        <p class="muted" style="padding:18px">Calculando fluxo do mês...</p>
      </div>
    </section>

    <!-- Próximas recorrências (fixo no HTML) -->
    <section class="panel" id="upcomingRecurringPanelFinZen">
      <div class="panel-header">
        <h2>Próximas Recorrências</h2>
        <div class="ff-month-filter">
          <input type="month" id="filterRecorrencia">
          <button type="button" class="btn btn-secondary compact" id="btnClearRecorrencia">Todos</button>
        </div>
      </div>
      <div id="upcomingRecurringListFinZen" class="table-wrap">
        <p class="muted" style="padding:18px">Carregando previsões...</p>
      </div>
    </section>

    <!-- Lista de movimentações com filtro de mês -->
    <section class="panel">
      <div class="panel-header">
        <h2>Movimentações</h2>
        <div class="ff-month-filter">
          <select id="filterCategory">
            <option value="">Todas categorias</option>
          </select>
          <input type="month" id="filterMonth">
          <button type="button" class="btn btn-secondary compact" id="btnClearFilter">Tudo</button>
        </div>
      </div>
      <p id="filterCategoryTotal" class="muted" style="padding:0 18px;font-size:13px;display:none"></p>
      <div id="movementList" class="table-wrap">
        <p class="muted" style="padding:18px">Carregando...</p>
      </div>
    </section>
  </main>
</div>


<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/movements.js"></script>
</body>
</html>
